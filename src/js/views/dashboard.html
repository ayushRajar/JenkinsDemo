<div class="oj-hybrid-padding">
  <h1>Dashboard Content Area</h1>
  <div>
    <p>Welcome to the First APP</p>
  </div>
  <div>
    <oj-input-date
      label-hint="Enter Your Date of Birth"
      value="{{birthDate}}"
      converter="[[dateConverter]]"
      help.instruction="Format: MM/DD/YYYY"></oj-input-date>
      <oj-c-input-text label-hint="Enter Your Name" value="{{name}}"
      required
      validators="[[lengthValidator]]"
      help.instruction="Only alphabeds , 3-10 characters"></oj-c-input-text>
  </div>
</div>
